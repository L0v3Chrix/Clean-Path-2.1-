name: Verify ClearPath

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  database-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: supabase start
      - name: Export local Supabase environment
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_DEMO_ORGANIZATION_ID=00000000-0000-4000-8000-000000000001"
            echo "VITE_AUTH_BYPASS=false"
            echo "VITE_CLEARPATH_DEMO_MODE=false"
            echo "SAMPLE_AUTH_PASSWORD=ClearPath-test-only-2026!"
            echo "USER_INVITE_REDIRECT_URL=http://127.0.0.1:4176/accept-invite"
            echo "CLEARPATH_SUPABASE_PUBLIC_URL=$API_URL"
          } >> "$GITHUB_ENV"
      - run: npm run test:db
      - run: npm run sample:seed
      - name: Start and verify Edge Functions
        run: |
          printf '%s\n' \
            "USER_INVITE_REDIRECT_URL=$USER_INVITE_REDIRECT_URL" \
            "CLEARPATH_SUPABASE_PUBLIC_URL=$CLEARPATH_SUPABASE_PUBLIC_URL" \
            > /tmp/clearpath-functions.env
          nohup supabase functions serve --env-file /tmp/clearpath-functions.env \
            > /tmp/clearpath-functions.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/functions/v1/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/clearpath-functions.log
          exit 1
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            /tmp/clearpath-functions.log
      - if: always()
        run: supabase stop --no-backup
